name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Generated Worker types are current
        run: npx wrangler types --check
      - name: Tests
        run: npm test
      - name: Build (client bundle + wrangler dry-run, no Cloudflare credentials)
        run: npm run build
      - name: Reporting script syntax
        run: bash -n docs/report.sh
