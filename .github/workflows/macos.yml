name: macOS app

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  app:
    name: Build Bot Fleet.app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tools
        run: brew install xcodegen
      - name: Generate and build (Release, ad-hoc signed)
        working-directory: macos
        run: |
          xcodegen generate
          xcodebuild -project BotFleet.xcodeproj -scheme BotFleet -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build > build.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -80 || true
          test "$STATUS" = 0
      - name: No web view in the app
        working-directory: macos
        run: |
          if grep -rnE "import WebKit|WKWebView" App; then exit 1; fi
          if otool -L build/Build/Products/Release/BotFleet.app/Contents/MacOS/BotFleet | grep -i webkit; then exit 1; fi
      - name: Screenshots from the sample /api/v1/state reply
        working-directory: macos
        run: |
          BIN="build/Build/Products/Release/BotFleet.app/Contents/MacOS/BotFleet"
          mkdir -p shots
          for TAB in focus board feed; do
            "$BIN" --snapshot ci/sample-state.json "shots/$TAB.png" tab=$TAB width=1440 height=900 > "shots/$TAB.log"
            "$BIN" --snapshot ci/sample-state.json "shots/$TAB-wide.png" tab=$TAB width=1920 height=700 > /dev/null
            "$BIN" --snapshot ci/sample-state.json "shots/$TAB-tall.png" tab=$TAB width=600 height=1400 > /dev/null
          done
          "$BIN" --snapshot ci/sample-state.json shots/focus-dark.png tab=focus dark > /dev/null
          "$BIN" --snapshot ci/sample-state.json shots/board-admin.png tab=board filter=leaf > /dev/null
          "$BIN" --snapshot ci/sample-state.json shots/feed-offline.png tab=feed state=offline > /dev/null
          "$BIN" --snapshot ci/sample-state.json shots/grok-popover.png part=grok > /dev/null
          "$BIN" --snapshot ci/sample-state.json shots/focus-nodata.png tab=focus nodata > /dev/null
          "$BIN" --snapshot ci/sample-state.json shots/focus-toast.png tab=focus toast=saved > shots/toast.log
          "$BIN" --snapshot ci/sample-state.json shots/focus-toast-tall.png tab=focus toast=saved width=600 height=1400 > /dev/null
          # Monitor, the main view: wide (split), wide and short, tall and narrow (one column), dark.
          "$BIN" --snapshot ci/sample-state.json shots/monitor.png tab=monitor width=1440 height=900 > shots/monitor.log
          "$BIN" --snapshot ci/sample-state.json shots/monitor-wide.png tab=monitor width=1920 height=700 > /dev/null
          "$BIN" --snapshot ci/sample-state.json shots/monitor-tall.png tab=monitor width=600 height=1400 > /dev/null
          "$BIN" --snapshot ci/sample-state.json shots/monitor-dark.png tab=monitor dark > /dev/null
          "$BIN" --snapshot ci/sample-state.json shots/monitor-switch-FIXTURE.png tab=monitor usage=switch > shots/monitor-switch.log
          "$BIN" --snapshot ci/sample-state.json shots/later.png tab=later > /dev/null
          # The same window from the frozen live GET /api/v1/state (Nov 26), for docs/screenshots/simple-main/.
          LIVE=../docs/screenshots/simple-main/live-state.json
          mkdir -p shots/live
          "$BIN" --snapshot "$LIVE" shots/live/monitor-wide.png tab=monitor width=1440 height=900 > shots/live/monitor.log
          "$BIN" --snapshot "$LIVE" shots/live/monitor-wide-short.png tab=monitor width=1920 height=700 > /dev/null
          "$BIN" --snapshot "$LIVE" shots/live/monitor-narrow.png tab=monitor width=600 height=1400 > /dev/null
          "$BIN" --snapshot "$LIVE" shots/live/monitor-dark.png tab=monitor dark > /dev/null
          "$BIN" --snapshot "$LIVE" shots/live/fixture-switch-banner.png tab=monitor usage=switch > shots/live/switch.log
          cat shots/focus.log
          cat shots/monitor.log shots/monitor-switch.log shots/live/monitor.log | grep -E '^(ACCOUNT|ACCOUNTS|BANNER|MONITOR|MSESSION|RECENT|WROTE) '
          # Monitor: signals, Use first only on Main Claude, no banner while nothing is at Switch now.
          grep -F 'ACCOUNT Main Claude | 5-hour 38%, Weekly 29% | OK | resets 3:49 PM | Use first' shots/monitor.log
          grep -F 'ACCOUNT Admin Claude | 5-hour 82%, Weekly 29% | Near limit' shots/monitor.log
          grep -F 'ACCOUNT Cursor | Models 30%, Other 62% | OK' shots/monitor.log
          grep -F 'ACCOUNT Grok · Admin | used 23% | OK' shots/monitor.log
          grep -F 'BANNER none' shots/monitor.log
          if grep -E '^ACCOUNT (API|.*API ·)' shots/monitor.log; then exit 1; fi
          # Sessions: owner names, cleaned titles, live first; recently used by activity, no [TEST].
          grep -F 'MONITOR sessions=9 live=6' shots/monitor.log
          grep -F 'MSESSION T3 | Folder sync v2 · PR #48 | Finished | Dropbox Rebuild PM | Main Claude | 52m' shots/monitor.log
          grep -F 'RECENT Chief | Live | now | Designing the merged Fleet monitor' shots/monitor.log
          grep -F 'RECENT Dropbox Rebuild PM | Needs you | needs you | 1m | Wants your review of PR #48' shots/monitor.log
          grep -F 'RECENT Researcher | Idle | 1h | Cloudinary vs Dropbox cost memo shared' shots/monitor.log
          grep -F 'RECENT Marketing Portal PM | Saved | 3h' shots/monitor.log
          if grep -F '[TEST]' shots/monitor.log; then exit 1; fi
          # Fixture: Main Claude at Switch now, so Use first and the banner point to Cursor. Never to Admin Claude or Codex.
          grep -F 'ACCOUNT Main Claude | 5-hour 96%, Weekly 29% | Switch now' shots/monitor-switch.log
          grep -E '^ACCOUNT Cursor \| Models 81%, Other 62% \| Near limit \| .* \| Use first$' shots/monitor-switch.log
          grep -F 'BANNER Switch now · Main Claude · 5-hour 96% · resets' shots/monitor-switch.log
          grep -E '^BANNER .* · Use Cursor$' shots/monitor-switch.log
          if grep -E '^ACCOUNT (Admin Claude|Codex|Grok).*Use first' shots/monitor.log shots/monitor-switch.log shots/live/switch.log; then exit 1; fi
          if grep -E '^BANNER .*Use (Admin Claude|Codex)' shots/monitor-switch.log shots/live/switch.log; then exit 1; fi
          # Live data: all OK today, Main Claude first.
          grep -F 'ACCOUNT Main Claude | Weekly 6%, 5-hour no limit | OK | resets Wed 1:00 PM | Use first' shots/live/monitor.log
          grep -F 'BANNER none' shots/live/monitor.log
          grep -F 'MSESSION T3 | Phase 2 Brand Templates | Live | Marketing Portal PM | Main Claude | 5h 49m' shots/live/monitor.log
          grep -F 'RECENT Copy Library PM | Stale | needs you | 1d | Auditing 140 copy blocks for brand voice' shots/live/monitor.log
          grep -F 'BANNER Switch now · Main Claude · 5-hour 96%' shots/live/switch.log
          grep -E '^BANNER .* · Use Cursor$' shots/live/switch.log
          # Decoded the whole reply, and every bot landed in exactly one column.
          grep -F 'STATE version=2 bots=36 attention=5 sessions=9 accounts=6 grok=2 activity=36' shots/focus.log
          grep -F 'PARTITION attention=5 saved=1 working=7 idle=23 rows=36' shots/focus.log
          # Summaries hidden and the repeated Internal DAM message folded into its status.
          grep -F 'ACTIVITY raw=36 visible=32' shots/focus.log
          grep -F 'STRIP sessions=9 running=6' shots/focus.log
          # Later on the first bot: it moves to Saved at once (also off the menu bar count) and the toast offers Undo.
          grep -F 'TOAST Saved for later · Undo=Dropbox Rebuild PM | saved=2 attention=4 menu=4' shots/toast.log
          grep -F 'SYMBOLS shapes=11 initials=25' shots/focus.log
          grep -F 'SYMBOL Chief · Chief of Staff | star black' shots/focus.log
          grep -E '^SYMBOL dr eggbot \| initials DE #[0-9]$' shots/focus.log
          grep -F "ATTENTION leaf | Leaf | Needs me | Open chat · Admin | grokbot://app/v1/agent?id=1eaf0000-0000-4000-8000-000000000001" shots/focus.log
          grep -F "ATTENTION work | Comment Reply App | Stuck | Open chat · Avi's Work | grokbot://app/v1/agent?id=75096179-855f-4859-a4b8-918e0456d9ba" shots/focus.log
          grep -F 'ATTENTION work | Event Kickoff PM | Stale' shots/focus.log
          grep -F 'SESSION T3 | Reply drafts v3 | Failed | started by Comment Reply App' shots/focus.log
          grep -F 'SESSION Claude | Claude CLI ~/scratch | Live | started by Unassigned' shots/focus.log
          if grep -E '^ATTENTION .*(Click tracking|copy-audit|Reply drafts|Rollback test)' shots/focus.log; then exit 1; fi
          ls -la shots
          for f in shots/*.png; do test -s "$f"; done
      - name: Verify and zip
        working-directory: macos
        run: |
          APP="build/Build/Products/Release/BotFleet.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" BotFleet.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BotFleet-macOS
          path: macos/BotFleet.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BotFleet-macOS-screenshots
          path: macos/shots/
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BotFleet-macOS
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" BotFleet.zip \
            --title "Bot Fleet $GITHUB_REF_NAME" \
            --notes "Ad-hoc signed Bot Fleet.app. Unzip, then right-click the app and choose Open the first time. See docs/MACOS.md."
